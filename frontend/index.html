<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header></header>
    <main>
        <h1>
            Server Monitor
        </h1>
        <div class="main-content">
            <div class="content-row" id="label-row">
                <div class="content-cell">
                    <img src="imgs/green-circle.svg" class="status-circle" alt="coloured circle that represents the status of the server.">
                </div>
                <div class="content-cell">
                    <p>Server Name</p>
                </div>
                <div class="content-cell">
                    <p>Server Status</p>
                </div>
                <div class="content-cell">
                    <p>Server Name</p>
                </div>
                <div class="content-cell">
                    <p>Map</p>
                </div>
                <div class="content-cell">
                    <p>Server Address</p>
                </div>
                <div class="content-cell">
                    <p>Server Port</p>
                </div>
                <div class="content-cell">
                    <p>Player Count</p>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>Darian Elwood 2026 &copy;</p>
    </footer>
</body>
</html>
